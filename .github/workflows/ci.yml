name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # git can hand the runner a wrapper without the executable bit.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # The integration tests start PostgreSQL through Testcontainers, which uses the Docker
      # daemon that GitHub-hosted Ubuntu runners already provide, so no extra setup step is needed.
      - name: Build and test
        run: ./mvnw -B clean test
