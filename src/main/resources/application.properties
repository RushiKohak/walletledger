spring.application.name=walletledger

# Connection settings come from the environment, with local defaults, so the same jar runs on a
# laptop, inside docker compose and anywhere else without a rebuild. Tests replace every one of
# these through Testcontainers' @DynamicPropertySource, which has higher precedence than this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/walletledger}
spring.datasource.username=${DB_USER:walletledger}
spring.datasource.password=${DB_PASSWORD:walletledger}

# The pool is a ceiling, not a target: 10 idle-capable connections is plenty for a single
# instance, and a smaller number is what keeps a database from being flooded by replicas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Flyway owns the schema; Hibernate may only check that entities match the migrated tables.
spring.jpa.hibernate.ddl-auto=validate

# Transactions are opened and closed inside the service layer, never during view rendering.
spring.jpa.open-in-view=false
